<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>青龙篇 - 作品展示</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0a0a0f;--surface:#12121a;--border:#1e1e2e;--text:#c8c8d4;--muted:#78788c;--accent:#00e5a0;--accent-dim:#00c48a;--accent-glow:rgba(0,229,160,0.15)}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;line-height:1.6;min-height:100vh;overflow-x:hidden}

/* Particle Canvas */
#particles{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0}

/* Hero */
.hero{position:relative;z-index:1;text-align:center;padding:80px 20px 60px}
.hero::after{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:600px;height:300px;background:radial-gradient(ellipse,var(--accent-glow),transparent 70%);pointer-events:none;z-index:-1}
.hero h1{font-size:clamp(2rem,5vw,3.5rem);font-weight:900;letter-spacing:.04em;background:linear-gradient(135deg,#fff 0%,var(--accent) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:12px}
.hero .subtitle{font-size:1.1rem;color:var(--muted);letter-spacing:.08em}
.hero .count{display:inline-block;margin-top:16px;padding:6px 18px;border:1px solid var(--border);border-radius:20px;font-size:.85rem;color:var(--accent);background:rgba(0,229,160,0.05)}

/* Masonry */
.gallery-wrap{position:relative;z-index:1;max-width:1400px;margin:0 auto;padding:0 24px 60px}
.gallery{column-count:4;column-gap:16px}
@media(max-width:1100px){.gallery{column-count:3}}
@media(max-width:768px){.gallery{column-count:2;column-gap:10px}}
@media(max-width:480px){.gallery{column-count:1}}

.card{break-inside:avoid;margin-bottom:16px;border-radius:12px;overflow:hidden;cursor:pointer;position:relative;border:1px solid var(--border);background:var(--surface);transition:transform .3s ease,box-shadow .3s ease,border-color .3s ease}
.card:hover{transform:translateY(-4px);box-shadow:0 12px 40px rgba(0,0,0,.5),0 0 30px var(--accent-glow);border-color:var(--accent-dim)}
.card img{width:100%;display:block}
.card .label{position:absolute;bottom:0;left:0;right:0;padding:12px 16px;background:linear-gradient(transparent,rgba(10,10,15,.92));font-size:.85rem;color:var(--accent);letter-spacing:.04em;opacity:0;transition:opacity .3s ease}
.card:hover .label{opacity:1}

/* Lightbox */
.lightbox{position:fixed;inset:0;z-index:9999;background:rgba(5,5,10,.96);display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:opacity .3s ease,visibility .3s ease;cursor:pointer}
.lightbox.active{opacity:1;visibility:visible}
.lightbox img{max-width:92vw;max-height:90vh;object-fit:contain;border-radius:8px;box-shadow:0 20px 80px rgba(0,0,0,.7);cursor:default;pointer-events:none;user-select:none}
.lightbox .close{position:absolute;top:20px;right:28px;font-size:36px;color:var(--muted);cursor:pointer;z-index:10;transition:color .2s;line-height:1;user-select:none}
.lightbox .close:hover{color:#fff}
.lightbox .nav{position:absolute;top:50%;transform:translateY(-50%);font-size:42px;color:var(--muted);cursor:pointer;z-index:10;transition:color .2s;user-select:none;padding:10px}
.lightbox .nav:hover{color:#fff}
.lightbox .prev{left:20px}
.lightbox .next{right:20px}
.lightbox .info{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);color:var(--muted);font-size:.85rem;letter-spacing:.06em}
.lightbox .counter{color:var(--accent)}

/* Footer */
.footer{position:relative;z-index:1;text-align:center;padding:40px 20px;color:var(--muted);font-size:.8rem;letter-spacing:.04em;border-top:1px solid var(--border)}
</style>
</head>
<body>
<canvas id="particles"></canvas>

<section class="hero">
  <h1>青龙篇</h1>
  <p class="subtitle">墨 韵 · 青 龙</p>
  <span class="count">共 12 幅作品</span>
</section>

<div class="gallery-wrap">
  <div class="gallery" id="gallery"></div>
</div>

<div class="lightbox" id="lightbox">
  <span class="close" id="lbClose">&times;</span>
  <span class="nav prev" id="lbPrev">&lsaquo;</span>
  <span class="nav next" id="lbNext">&rsaquo;</span>
  <img id="lbImg" src="" alt="" />
  <div class="info" id="lbInfo"></div>
</div>

<footer class="footer">青龙篇 · 作品集</footer>

<script>
// --- Image Data ---
var IMAGES = [
{"name":"1","src":"images/1.webp"},
{"name":"2","src":"images/2.webp"},
{"name":"3","src":"images/3.webp"},
{"name":"4","src":"images/4.webp"},
{"name":"5-1","src":"images/5.webp"},
{"name":"5","src":"images/6.webp"},
{"name":"6","src":"images/7.webp"},
{"name":"7","src":"images/8.webp"},
{"name":"8","src":"images/9.webp"},
{"name":"9","src":"images/10.webp"},
{"name":"c8aek6q1","src":"images/11.webp"},
{"name":"t56e40ct","src":"images/12.webp"}
];

// --- Build Gallery ---
var gallery = document.getElementById('gallery');
IMAGES.forEach(function(img,i){
  var card = document.createElement('div');
  card.className = 'card';
  card.setAttribute('data-index', i);
  card.innerHTML = '<img src="' + img.src + '" alt="' + img.name + '" loading="lazy"><div class="label">' + img.name + '</div>';
  card.addEventListener('click', function(e){ openLightbox(i); });
  gallery.appendChild(card);
});

// --- Lightbox ---
var lb = document.getElementById('lightbox');
var lbImg = document.getElementById('lbImg');
var lbInfo = document.getElementById('lbInfo');
var currentIndex = 0;

function openLightbox(idx){
  currentIndex = idx;
  var img = IMAGES[idx];
  lbImg.src = img.src;
  lbInfo.innerHTML = '<span class="counter">' + (idx+1) + '</span> / ' + IMAGES.length + ' &mdash; ' + img.name;
  lb.classList.add('active');
  document.body.style.overflow = 'hidden';
}

function closeLightbox(){
  lb.classList.remove('active');
  document.body.style.overflow = '';
}

function navLightbox(dir){
  currentIndex = (currentIndex + dir + IMAGES.length) % IMAGES.length;
  var img = IMAGES[currentIndex];
  lbImg.src = img.src;
  lbInfo.innerHTML = '<span class="counter">' + (currentIndex+1) + '</span> / ' + IMAGES.length + ' &mdash; ' + img.name;
}

document.getElementById('lbClose').addEventListener('click', function(e){ e.stopPropagation(); closeLightbox(); });
document.getElementById('lbPrev').addEventListener('click', function(e){ e.stopPropagation(); navLightbox(-1); });
document.getElementById('lbNext').addEventListener('click', function(e){ e.stopPropagation(); navLightbox(1); });
lb.addEventListener('click', function(e){ if(e.target===lb) closeLightbox(); });

document.addEventListener('keydown', function(e){
  if(!lb.classList.contains('active')) return;
  if(e.key==='Escape'){ closeLightbox(); }
  else if(e.key==='ArrowLeft'){ navLightbox(-1); }
  else if(e.key==='ArrowRight'){ navLightbox(1); }
});

// --- Particles ---
(function(){
  var canvas = document.getElementById('particles');
  var ctx = canvas.getContext('2d');
  var particles = [];
  var maxParticles = 60;

  function resize(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  for(var i=0;i<maxParticles;i++){
    particles.push({
      x:Math.random()*canvas.width,
      y:Math.random()*canvas.height,
      vx:(Math.random()-0.5)*0.4,
      vy:(Math.random()-0.5)*0.4,
      r:Math.random()*1.5+0.5,
      alpha:Math.random()*0.5+0.1
    });
  }

  function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    for(var i=0;i<particles.length;i++){
      var p=particles[i];
      p.x+=p.vx;
      p.y+=p.vy;
      if(p.x<0)p.x=canvas.width;
      if(p.x>canvas.width)p.x=0;
      if(p.y<0)p.y=canvas.height;
      if(p.y>canvas.height)p.y=0;
      ctx.beginPath();
      ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle='rgba(0,229,160,'+p.alpha+')';
      ctx.fill();
    }

    // Draw connections
    for(var i=0;i<particles.length;i++){
      for(var j=i+1;j<particles.length;j++){
        var dx=particles[i].x-particles[j].x;
        var dy=particles[i].y-particles[j].y;
        var dist=Math.sqrt(dx*dx+dy*dy);
        if(dist<120){
          ctx.beginPath();
          ctx.moveTo(particles[i].x,particles[i].y);
          ctx.lineTo(particles[j].x,particles[j].y);
          ctx.strokeStyle='rgba(0,229,160,'+(0.06*(1-dist/120))+')';
          ctx.lineWidth=0.5;
          ctx.stroke();
        }
      }
    }
    requestAnimationFrame(draw);
  }
  draw();
})();
</script>
</body>
</html>
